# vim:filetype=kitty
# Ported from WezTerm (wezterm.lua → kitty.conf)
# Some features couldn't be ported – see ~/.config/kitty/README.md

# ── General ────────────────────────────────────────────────────────────────────

confirm_os_window_close 0
mouse_hide_wait 0.0
strip_trailing_spaces never
dynamic_background_opacity yes
allow_remote_control yes

# BEGIN_KITTY_THEME
# Catppuccin-Latte
include current-theme.conf
# END_KITTY_THEME

# ── Font ────────────────────────────────────────────────────────────────────────

font_family      Iosevka Term
font_size        12
adjust_line_height 0
# hack for nerd font symbols
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D2,U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AD,U+E700-U+E7BC,U+E7C4-U+E7C5,U+EA60-U+EA88,U+EA8A-U+EA8C,U+EA8F-U+EAC7,U+EAC9,U+EACC-U+EAFA,U+EAFC-U+EB09,U+EB0B-U+EB4E,U+EB50-U+EBEB,U+F000-U+F00E,U+F010-U+F01E,U+F021-U+F03E,U+F040-U+F04E,U+F050-U+F05E,U+F060-U+F06E,U+F070-U+F07E,U+F080-U+F08E,U+F090-U+F09E,U+F0A0-U+F0AE,U+F0B0-U+F0B2,U+F0C0-U+F0CE,U+F0D0-U+F0DE,U+F0E0-U+F0EE,U+F0F0-U+F0FE,U+F100-U+F10E,U+F110-U+F115,U+F118-U+F11E,U+F120-U+F12E,U+F130-U+F13E,U+F140-U+F14E,U+F150-U+F15E,U+F160-U+F16E,U+F170-U+F17E,U+F180-U+F18E,U+F190-U+F19E,U+F1A0-U+F1AE,U+F1B0-U+F1BE,U+F1C0-U+F1CE,U+F1D0-U+F1DE,U+F1E0-U+F1EE,U+F1F0-U+F1FE,U+F200-U+F20E,U+F210-U+F21E,U+F221-U+F22D,U+F230-U+F23E,U+F240-U+F24E,U+F250-U+F25E,U+F260-U+F26E,U+F270-U+F27E,U+F280-U+F28E,U+F290-U+F29E,U+F2A0-U+F2AE,U+F2B0-U+F2BE,U+F2C0-U+F2CE,U+F2D0-U+F2DE,U+F2E0,U+F300-U+F32F,U+F400-U+F533,U+F0001-U+F012E,U+F0131-U+F0205,U+F0207-U+F02D0,U+F02D2-U+F02D4,U+F02D6-U+F02F4,U+F02F6-U+F0386,U+F0388-U+F043C,U+F043E-U+F05CC,U+F05CE-U+F0AF5,U+F0AF7-U+F0AF8,U+F0AFA-U+F0AFB,U+F0AFD-U+F0B02,U+F0B04,U+F0B06-U+F0C15,U+F0C18-U+F1AF0 Symbols Nerd Font Mono

# ── Window ──────────────────────────────────────────────────────────────────────

enabled_layouts splits
# wayland_titlebar_color system
window_padding_width 2
hide_window_decorations no
wheel_scroll_multiplier 5.0
remember_window_size yes
initial_window_width  900
initial_window_height 600

# ── Cursor ──────────────────────────────────────────────────────────────────────

cursor_shape block
cursor_beam_thickness 2.0

# ── Tab bar ─────────────────────────────────────────────────────────────────────

# left
tab_bar_edge left
tab_bar_style powerline
tab_bar_margin_width 0.0
tab_bar_min_tabs 1

# ── Mouse ────────────────────────────────────────────────────────────────────────

# Triple-click → select full line
mouse_map left triplepress ungrabbed mouse_selection line
mouse_map left click ungrabbed mouse_selection normal
mouse_map right click ungrabbed paste_from_clipboard

# ── URL handling ────────────────────────────────────────────────────────────────

# Kitty has built-in URL detection; open with default browser on click
open_url_with default
underline_hyperlinks hover
detect_urls yes
url_style curly

# ── Keybindings ──────────────────────────────────────────────────────────────────

kitty_mod ctrl+shift

# ── Splits (Ctrl+s leader + key) ──
map ctrl+s>backslash     launch leftlocation=vsplit --cwd=current
map ctrl+s>minus         launch --location=hsplit --cwd=current

# ── Pane/tab management (Ctrl+s leader + key) ──
map ctrl+s>z             toggle_layout stack
map ctrl+s>x             close_window
map ctrl+s>c             new_tab
map ctrl+s>n             next_tab
map ctrl+s>p             previous_tab
map ctrl+s>enter         new_window
map ctrl+s>w             close_window
map ctrl+s>s             kitten scrollback

# ── Pane navigation (Alt+h/j/k/l) ──
map alt+h                neighboring_window left
map alt+j                neighboring_window down
map alt+k                neighboring_window up
map alt+l                neighboring_window right

# ── Pane resize (Alt+Shift+h/j/k/l) ──
map alt+shift+h          resize_neighboring_window left  4
map alt+shift+j          resize_neighboring_window down  4
map alt+shift+k          resize_neighboring_window up    4
map alt+shift+l          resize_neighboring_window right 4

# ── Font size ──
map ctrl+equal           change_font_size all +2.0
map ctrl+minus           change_font_size all -2.0
map ctrl+0               change_font_size all 12

# ── Copy / Paste ──
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard

# ── Scroll / Misc ──
map alt+u                scroll_line_up
map alt+d                scroll_line_down

# Disable default shortcuts that conflict with above
map ctrl+shift+t         no_op
